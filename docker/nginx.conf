server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: усі невідомі шляхи віддають index.html
    location / {
        try_files $uri $uri/ /index.html;
        # HTML не кешуємо: інакше після оновлення фронтенду браузер може
        # лишитись зі старою розміткою й новими модулями
        add_header Cache-Control "no-store";
    }

    # ES-модулі та конфіги не кешуємо — під час розробки це лише плутає
    location ~* \.(js|css|json)$ {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # WebSocket-канали /ws/live та /ws/metrics (етапи 2–3)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
